<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pesquisa sobre Segurança Viária em Moema</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        #map {
            width: 100%;
            height: 600px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .status-mapa {
            margin-top: 10px;
            font-size: 14px;
        }
        .marcador-escola {
    background: transparent;
    border: none;
}

.circulo-escola {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;
    color: #111111;

    border: 3px solid #222222;
    border-radius: 50%;

    font-size: 14px;
    font-weight: bold;

    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);

    cursor: pointer;
}

.circulo-escola:hover {
    transform: scale(1.15);
}

    </style>
</head>

<body>

<header>

    <h1>Pesquisa sobre Segurança Viária em Moema</h1>

    <p>
        Pesquisa sobre os deslocamentos escolares e a segurança
        viária no bairro de Moema, São Paulo.
    </p>

</header>

<main>

    <div class="caixa">

        <h2>Mapa da área de estudo</h2>

        <p>
            Este mapa será utilizado para indicar os trajetos
            realizados entre a residência e a escola.
        </p>

        <div id="map"></div>

        <div
            id="statusMapa"
            class="status-mapa"
        >
            Carregando mapa...
        </div>

    </div>

</main>

<script>

    // Coordenadas aproximadas do centro de Moema
    const centroMoema = [-23.6005, -46.6655];

    // Criação do mapa
    const map = L.map("map", {
        center: centroMoema,
        zoom: 14,
        zoomControl: true
    });

    // Camada OpenStreetMap
    const osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );

    osm.addTo(map);
// =====================================================
// ESCOLAS DA ÁREA DE ESTUDO
// Coordenadas extraídas dos arquivos KMZ do projeto QGIS
// =====================================================

const escolas = [

        numero: 21,

        lng: -46.65537456029791

    {

    },

        lat: -23.60921303209982,
        lng: -46.66934061663206
    },

    {
        numero: 16,

        descricao: "Ensino Infantil e Fundamental",
        lat: -23.60075913856005,
        lng: -46.66409164758021
    },

    {
        numero: 12,
        nome: "EMEF Prof. João Carlos da Silva Borges",
        descricao: "Ensino Fundamental",

        lng: -46.66290486249515
    },

    {

    {

    {

        descricao: "Educação Infantil",
        lat: -23.60648672044722,
        lng: -46.67317699050848
    }

];


// =====================================================
// INSERÇÃO DAS ESCOLAS NO MAPA
// =====================================================

const grupoEscolas = L.layerGroup().addTo(map);

escolas.forEach(function(escola) {

    const iconeNumerado = L.divIcon({

        className: "marcador-escola",

        html:
            '<div class="circulo-escola">' +
            escola.numero +
            '</div>',

        iconSize: [34, 34],

        iconAnchor: [17, 17],

        popupAnchor: [0, -18]

    });

    const marcador = L.marker(
        [escola.lat, escola.lng],
        {
            icon: iconeNumerado
        }
    );

    let conteudoPopup =
        "<strong>" +
        escola.numero +
        " — " +
        escola.nome +
        "</strong>";

    if (escola.descricao) {

        conteudoPopup +=
            "<br>" +
            escola.descricao;

    }

    marcador.bindPopup(conteudoPopup);

    marcador.addTo(grupoEscolas);

});
    // Mensagem quando os tiles carregarem
    osm.on("load", function () {

        document.getElementById("statusMapa").textContent =
            "Mapa carregado corretamente.";

    });

    // Detecção de erro
    osm.on("tileerror", function () {

        document.getElementById("statusMapa").textContent =
            "Houve um problema ao carregar parte do mapa-base.";

    });

    // Corrige possíveis problemas de dimensão
    setTimeout(function () {
        map.invalidateSize();
    }, 500);

</script>

</body>

</html>

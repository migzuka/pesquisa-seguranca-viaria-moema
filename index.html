<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pesquisa sobre Segurança Viária em Moema</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        #map {
            width: 100%;
            height: 600px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .status-mapa {
            margin-top: 10px;
            font-size: 14px;
        }

    </style>
</head>

<body>

<header>

    <h1>Pesquisa sobre Segurança Viária em Moema</h1>

    <p>
        Pesquisa sobre os deslocamentos escolares e a segurança
        viária no bairro de Moema, São Paulo.
    </p>

</header>

<main>

    <div class="caixa">

        <h2>Mapa da área de estudo</h2>

        <p>
            Este mapa será utilizado para indicar os trajetos
            realizados entre a residência e a escola.
        </p>

        <div id="map"></div>

        <div
            id="statusMapa"
            class="status-mapa"
        >
            Carregando mapa...
        </div>

    </div>

</main>

<script>

    // Coordenadas aproximadas do centro de Moema
    const centroMoema = [-23.6005, -46.6655];

    // Criação do mapa
    const map = L.map("map", {
        center: centroMoema,
        zoom: 14,
        zoomControl: true
    });

    // Camada OpenStreetMap
    const osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );

    osm.addTo(map);

    // Mensagem quando os tiles carregarem
    osm.on("load", function () {

        document.getElementById("statusMapa").textContent =
            "Mapa carregado corretamente.";

    });

    // Detecção de erro
    osm.on("tileerror", function () {

        document.getElementById("statusMapa").textContent =
            "Houve um problema ao carregar parte do mapa-base.";

    });

    // Corrige possíveis problemas de dimensão
    setTimeout(function () {
        map.invalidateSize();
    }, 500);

</script>

</body>

</html>

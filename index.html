<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pesquisa sobre Segurança Viária em Moema</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        #map {
            width: 100%;
            height: 600px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .status-mapa {
            margin-top: 10px;
            font-size: 14px;
        }

    </style>
</head>

<body>

<header>

    <h1>Pesquisa sobre Segurança Viária em Moema</h1>

    <p>
        Pesquisa sobre os deslocamentos escolares e a segurança
        viária no bairro de Moema, São Paulo.
    </p>

</header>

<main>

    <div class="caixa">

        <h2>Mapa da área de estudo</h2>

        <p>
            Este mapa será utilizado para indicar os trajetos
            realizados entre a residência e a escola.
        </p>

        <div id="map"></div>

        <div
            id="statusMapa"
            class="status-mapa"
        >
            Carregando mapa...
        </div>

    </div>

</main>

<script>

    // Coordenadas aproximadas do centro de Moema
    const centroMoema = [-23.6005, -46.6655];

    // Criação do mapa
    const map = L.map("map", {
        center: centroMoema,
        zoom: 14,
        zoomControl: true
    });

    // Camada OpenStreetMap
    const osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );

    osm.addTo(map);
// =====================================================
// ESCOLAS DA ÁREA DE ESTUDO
// Coordenadas extraídas dos arquivos KMZ do projeto QGIS
// =====================================================

const escolas = [

    {
        nome: "AVIVA",

        lng: -46.65537456029791
    },

    {
        nome: "be.Living",

        lng: -46.65847546305854
    },

    {

        descricao: "Ensino Fundamental e Médio",
        lat: -23.6129807682017,
        lng: -46.66853756098254
    },

    {
        nome: "Colégio Ítalo-Brasileiro",
        descricao: "Ensino Fundamental e Médio",
        lat: -23.60804143761485,
        lng: -46.66075710524122
    },

    {
        nome: "Colégio Itatiaia",
        descricao: "Berçário e Educação Infantil",
        lat: -23.60860742278564,
        lng: -46.66045158459803
    },

    {
        nome: "Colégio Lectus",
        descricao: "Educação Infantil e Ensino Médio",
        lat: -23.61314389902763,
        lng: -46.6621477061035
    },

    {
        nome: "Colégio Octagon – Objetivo",
        descricao: "Ensino Fundamental II",
        lat: -23.60921303209982,
        lng: -46.66934061663206
    },

    {
        nome: "CONSA – Colégio Francisco Nossa Senhora Aparecida",
        descricao: "Ensino Infantil e Fundamental",
        lat: -23.60075913856005,
        lng: -46.66409164758021
    },

    {
        nome: "E. E. Cesar Martinez",
        descricao: "Ensino Fundamental",
        lat: -23.60135101962355,
        lng: -46.65803780575516
    },

    {
        nome: "E. E. Professor Napoleão de Carvalho Freire",
        descricao: "Ensino Fundamental e Médio",
        lat: -23.60935391665141,
        lng: -46.67247914709958
    },

    {
        nome: "EMEF Prof. João Carlos da Silva Borges",

        lng: -46.66290486249515
    },

    {
        nome: "EMEI Dona Anita Costa",

        lng: -46.6579872597279
    },

    {

        lat: -23.61615578220294,
        lng: -46.66236774388901
    },

    {
        nome: "EMEI Prof. Inácio Henrique Romero",

        lat: -23.60945553998751,

    },

    {

        lng: -46.65651608992828
    },

    {

    },

    {

        lat: -23.59843479360499,
        lng: -46.66964221841899
    },

    {
        nome: "Escola Morumbi – Colégio Mor",

        lat: -23.6089730003107,
        lng: -46.65730823228701
    },

    {

        lat: -23.60455438702793,
        lng: -46.67206283192699
    },

    {
        nome: "Fadelito Moema",
        descricao: "Educação Infantil",
        lat: -23.60219902716726,
        lng: -46.66921944553429
    },

    {

        lng: -46.67281152648513
    },

    {
        nome: "Peixinho Vermelho",
        descricao: "Educação Infantil",
        lat: -23.60648672044722,
        lng: -46.67317699050848
    }

];


// =====================================================
// INSERÇÃO DAS ESCOLAS NO MAPA
// =====================================================

const grupoEscolas = L.layerGroup().addTo(map);

escolas.forEach(function(escola, indice) {

    const marcador = L.marker(
        [escola.lat, escola.lng]
    );

    let conteudoPopup =
        "<strong>" + escola.nome + "</strong>";

    if (escola.descricao) {
        conteudoPopup +=
            "<br>" + escola.descricao;
    }

    marcador.bindPopup(conteudoPopup);

    marcador.addTo(grupoEscolas);

});
    // Mensagem quando os tiles carregarem
    osm.on("load", function () {

        document.getElementById("statusMapa").textContent =
            "Mapa carregado corretamente.";

    });

    // Detecção de erro
    osm.on("tileerror", function () {

        document.getElementById("statusMapa").textContent =
            "Houve um problema ao carregar parte do mapa-base.";

    });

    // Corrige possíveis problemas de dimensão
    setTimeout(function () {
        map.invalidateSize();
    }, 500);

</script>

</body>

</html>
